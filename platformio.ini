; PlatformIO Project Configuration File
; Project: ESP8266 / ESP32 Spotify Display 1.77" TFT ST7735 (128x160)

[platformio]
default_envs = nodemcuv2

; Entorno para NodeMCU ESP8266 (ESP-12E / Lolin V3)
[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.f_cpu = 160000000L ; Overclock a 160MHz para decodificación JPEG rápida y SSL

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    bodmer/TJpg_Decoder @ ^1.1.0
    bblanchon/ArduinoJson @ ^7.0.4

build_flags =
    -D USER_SETUP_LOADED=1
    -D ST7735_DRIVER=1
    -D TFT_WIDTH=128
    -D TFT_HEIGHT=160
    -D ST7735_BLACKTAB=1
    -D TFT_CS=15   ; D8 (GPIO15)
    -D TFT_DC=0    ; D3 (GPIO0)
    -D TFT_RST=2   ; D4 (GPIO2)
    -D TFT_MOSI=13 ; D7 (GPIO13 / HSPI MOSI)
    -D TFT_SCLK=14 ; D5 (GPIO14 / HSPI SCK)
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D SPI_FREQUENCY=27000000

; Entorno alternativo para ESP32
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    bodmer/TJpg_Decoder @ ^1.1.0
    bblanchon/ArduinoJson @ ^7.0.4

build_flags =
    -D USER_SETUP_LOADED=1
    -D ST7735_DRIVER=1
    -D TFT_WIDTH=128
    -D TFT_HEIGHT=160
    -D ST7735_BLACKTAB=1
    -D TFT_CS=15   ; GPIO15
    -D TFT_DC=2    ; GPIO2
    -D TFT_RST=4   ; GPIO4
    -D TFT_MOSI=23 ; GPIO23 (VSPI MOSI)
    -D TFT_SCLK=18 ; GPIO18 (VSPI SCK)
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D SPI_FREQUENCY=27000000
